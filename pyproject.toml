[project]
name = "flowpilot"
version = "0.1.0"
description = "Product intelligence: detect metric anomalies, investigate them with evidence, evaluate experiments, and record human decisions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10.0",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "numpy>=2.0",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "scipy>=1.18.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "scipy-stubs>=1.18.1.1",
    "types-PyYAML",
]

[project.scripts]
flowpilot = "flowpilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
